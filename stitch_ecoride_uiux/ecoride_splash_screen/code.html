<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EcoRide Splash Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-fonts">
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'eco-green': '#1f4e3d',
            'eco-leaf': '#22a75d'
          }
        }
      }
    }
  </style>
</head>
<body class="m-0 p-0">
<!-- BEGIN: SplashScreen -->
<main class="bg-white w-full flex flex-col items-center justify-center relative overflow-hidden min-h-screen" data-purpose="splash-screen-container">
<!-- Logo Container -->
<div class="flex items-center space-x-3" data-purpose="logo-container">
<!-- Leaf Icon SVG -->
<svg aria-label="EcoRide Logo Icon" class="w-12 h-12 text-eco-leaf" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.5 2C17.5 2 21 5.5 21 10.5C21 15.5 17 19.5 12 19.5C7 19.5 3 15.5 3 10.5C3 5.5 6.5 2 6.5 2C6.5 2 8 6 12 6C16 6 17.5 2 17.5 2Z" fill="#22a75d"></path>
<path d="M12 6C10 6 7.5 8 7.5 11C7.5 14 10 16 12 16C14 16 16.5 14 16.5 11C16.5 8 14 6 12 6Z" fill="#1f4e3d"></path>
<path d="M12 19.5v3" stroke="#1f4e3d" stroke-linecap="round" stroke-width="2"></path>
</svg>
<!-- Brand Name -->
<h1 class="text-3xl font-bold text-eco-green tracking-tight" data-purpose="brand-name">EcoRide</h1>
</div>
</main>
<!-- END: SplashScreen -->
</body></html>
