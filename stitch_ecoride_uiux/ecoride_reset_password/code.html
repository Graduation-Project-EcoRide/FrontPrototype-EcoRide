<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EcoRide - Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary-fixed": "#96f996",
                        "on-primary": "#ffffff",

                        "inverse-on-surface": "#eef1ee",

                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#002116",
                        "outline-variant": "#becab9",
                        "on-secondary-fixed-variant": "#214f3f",
                        "surface": "#f7faf7",
                        "on-primary-fixed-variant": "#005316",
                        "tertiary-fixed-dim": "#b5cdb5",
                        "on-error-container": "#93000a",
                        "on-surface": "#181c1b",
                        "surface-container-low": "#f1f4f1",
                        "on-primary-container": "#067625"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "12px",
                        "stack-gap-md": "24px",
                        "stack-gap-lg": "40px",
                        "unit": "8px",
                        "gutter": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],

                        "body-lg": ["Inter"]
                    },
                    "fontSize": {

                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-[390px] h-full min-h-[884px] bg-surface rounded-3xl shadow-[0_8px_32px_rgba(11,61,46,0.05)] overflow-hidden relative flex flex-col items-center justify-center border border-primary/10">
<!-- Header / Logo Area -->
<header class="absolute top-0 w-full pt-16 pb-8 flex flex-col items-center justify-center">
<h1 class="font-headline-xl text-headline-xl text-primary mb-2">EcoRide</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-8">Secure your journey towards sustainable mobility.</p>
</header>
<!-- Main Form Container -->
<div class="w-full px-8 flex flex-col gap-6 mt-20">
<div class="text-center mb-4">
<h2 class="font-headline-md text-headline-md text-on-background">Reset Password</h2>
</div>
<!-- Input Form -->
<form class="flex flex-col gap-6 w-full" onsubmit="event.preventDefault();">
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="new-password">New Password</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest rounded-full border border-primary/15 focus:border-primary focus:ring-2 focus:ring-primary/20 px-6 font-body-md text-body-md text-on-background transition-all outline-none" id="new-password" placeholder="Enter new password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest rounded-full border border-primary/15 focus:border-primary focus:ring-2 focus:ring-primary/20 px-6 font-body-md text-body-md text-on-background transition-all outline-none" id="confirm-password" placeholder="Re-enter new password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Password Requirements Box -->
<div class="bg-tertiary-container/30 border border-primary/10 rounded-2xl p-5 mt-2">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                            Use at least 12 characters, including special characters, numbers, and a mix of lowercase and uppercase letters.
                        </p>
</div>
</div>
<!-- Spacer -->
<div class="h-4"></div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary-container text-on-primary-fixed-variant font-label-md text-label-md rounded-full shadow-[0_4px_12px_rgba(11,61,46,0.08)] hover:shadow-[0_2px_4px_rgba(11,61,46,0.05)] hover:translate-y-0.5 transition-all duration-200 flex items-center justify-center" type="submit">
                    Reset Password
                </button>
</form>
<div class="text-center mt-6">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>
<script>
        // Simple password visibility toggle logic
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
