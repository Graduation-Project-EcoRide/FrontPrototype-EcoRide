            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        body {

<body class="bg-background min-h-screen text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">
<!-- Form Section -->
<div class="flex flex-col justify-center px-container-padding py-stack-gap-lg sm:px-12 lg:px-24 relative z-10 bg-background">
<div class="w-full max-w-[440px] mx-auto">
<!-- Brand Anchor -->
<div class="flex items-center gap-unit mb-stack-gap-lg">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">eco</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">EcoRide</h1>
</div>
<!-- Header -->
<div class="mb-stack-gap-lg">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-unit">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the movement for sustainable mobility.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-gap-md" onsubmit="event.preventDefault();">
<!-- Full Name Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant ml-4 uppercase" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-6 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-[56px] rounded-full bg-surface-container-lowest border border-outline/20 pl-14 pr-6 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container focus:border-2 focus:outline-none transition-all duration-200" id="fullName" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant ml-4 uppercase" for="phone">Phone Number</label>
<div class="relative"><span class="material-symbols-outlined absolute left-6 top-1/2 -translate-y-1/2 text-outline">call</span>
<span class="material-symbols-outlined absolute left-6 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full h-[56px] rounded-full bg-surface-container-lowest border border-outline/20 pl-14 pr-6 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container focus:border-2 focus:outline-none transition-all duration-200" id="phone" placeholder="+962 00 000 0000" type="tel">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant ml-4 uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-6 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[56px] rounded-full bg-surface-container-lowest border border-outline/20 pl-14 pr-6 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container focus:border-2 focus:outline-none transition-all duration-200" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Sign Up Button -->
<button class="w-full h-[56px] mt-stack-gap-sm rounded-full bg-primary-container text-on-primary-container font-body-lg text-body-lg font-bold flex items-center justify-center gap-unit hover:scale-[0.98] transition-transform duration-200" type="submit">
                        Sign Up
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-stack-gap-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:text-on-primary-container transition-colors" href="#">Log In</a>
</p>
</div>
</div>
</div>
<!-- Decorative Image Section (Hidden on Mobile) -->
<div class="hidden lg:block relative w-full h-full bg-tertiary-container overflow-hidden rounded-l-[3rem]">
