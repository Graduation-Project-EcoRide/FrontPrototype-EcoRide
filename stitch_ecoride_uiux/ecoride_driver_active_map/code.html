<!-- TopAppBar -->
<header class="flex items-center justify-between px-margin-mobile w-full h-16 bg-surface dark:bg-on-background shadow-sm w-full top-0 sticky z-50 pt-safe">

<div class="w-10"></div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">EcoRide</h1>
<!-- Trailing Icon -->
<div class="w-10 flex justify-end">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed font-headline-sm text-headline-sm cursor-pointer hover:bg-surface-container dark:hover:bg-on-secondary-fixed-variant transition-colors rounded-full p-2 active:scale-95 duration-200" data-icon="notifications">notifications</button>
</div>
</header>
<!-- Main Canvas: Map & Overlays -->
<main class="flex-1 relative w-full h-full bg-surface-variant">
<!-- Map Background Level 0 -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly detailed, top-down digital map view of a modern city grid during daytime. The map features smooth, light gray roads and pale beige building blocks, characteristic of a clean, minimal user interface designed for ride-hailing drivers. A thick, vibrant teal route line snakes through the streets, indicating an active journey. The lighting is bright and even, creating a professional and functional aesthetic that prioritizes clarity over visual noise." data-location="City Route Map" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg')">
<!-- Subtle teal wash for brand consistency -->
<div class="absolute inset-0 bg-primary/5"></div>
</div>
<!-- Overlays Level 2/3 Container -->
<div class="absolute inset-0 flex flex-col justify-between p-margin-mobile pb-[100px] pointer-events-none z-10 pt-md">
<!-- Top Status Indicator -->
<div class="flex justify-center w-full pointer-events-auto">
<div class="bg-primary text-on-primary px-lg py-sm rounded-full shadow-lg flex items-center gap-xs font-label-lg text-label-lg backdrop-blur-md bg-opacity-95">
<span class="material-symbols-outlined" data-icon="directions_car" data-weight="fill">directions_car</span>
                    Arriving in 12 min
                </div>
</div>
<!-- Bottom Floating Card: Current Ride -->
<div class="bg-surface rounded-xl shadow-lg border border-primary/20 p-md flex flex-col gap-md pointer-events-auto w-full max-w-md mx-auto relative overflow-hidden">
<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>

<div class="flex justify-between items-center border-b border-surface-variant pb-sm mt-xs">
<div class="flex items-center gap-sm">
<div class="w-12 h-12 rounded-full bg-surface-container-highest overflow-hidden shadow-sm">

</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Sarah J.</h3>
<div class="flex items-center text-on-surface-variant font-label-sm text-label-sm gap-1 mt-0.5">
<span class="material-symbols-outlined text-[14px] text-tertiary" data-icon="star" data-weight="fill">star</span> 4.9
                            </div>
</div>
</div>
<div class="text-right flex flex-col items-end">
<div class="bg-surface-container-high px-2 py-0.5 rounded text-primary font-headline-sm text-headline-sm">

<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">12 min away</p>
</div>
</div>
<!-- Destination Details -->
<div class="flex items-start gap-sm px-1">
<div class="flex flex-col items-center mt-1">
<span class="material-symbols-outlined text-primary" data-icon="location_on" data-weight="fill">location_on</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Drop-off</p>

<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">North Entrance</p>
