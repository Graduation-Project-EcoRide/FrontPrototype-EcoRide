<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EcoRide - Become a Driver</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed": "#0b2011",
                      "on-surface": "#181c1b",
                      "on-secondary-container": "#3e6b5a",
                      "inverse-primary": "#7adc7d",
                      "surface-variant": "#e0e3e0",
                      "surface": "#f7faf7",
                      "on-tertiary-fixed-variant": "#374c3a",
                      "surface-container-highest": "#e0e3e0",
                      "surface-container-low": "#f1f4f1",
                      "on-tertiary": "#ffffff",
                      "primary-fixed-dim": "#7adc7d",
                      "tertiary-container": "#d2ebd2",
                      "on-background": "#181c1b",
                      "error": "#ba1a1a",
                      "on-primary-fixed": "#002105",
                      "secondary-fixed-dim": "#a0d1bc",
                      "on-primary-container": "#067625",
                      "secondary": "#396756",
                      "on-secondary-fixed": "#002116",
                      "surface-container-high": "#e6e9e6",
                      "inverse-on-surface": "#eef1ee",
                      "outline": "#6f7a6c",
                      "secondary-fixed": "#bcedd7",
                      "primary-fixed": "#96f996",
                      "primary-container": "#98fb98",
                      "surface-container": "#ecefec",
                      "secondary-container": "#b9ead4",
                      "background": "#f7faf7",
                      "tertiary-fixed": "#d0e9d1",
                      "on-error-container": "#93000a",
                      "surface-tint": "#006e21",
                      "surface-bright": "#f7faf7",
                      "on-secondary-fixed-variant": "#214f3f",
                      "on-primary-fixed-variant": "#005316",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#556b57",
                      "on-secondary": "#ffffff",
                      "outline-variant": "#becab9",
                      "tertiary-fixed-dim": "#b5cdb5",
                      "tertiary": "#4e6450",
                      "primary": "#006e21",
                      "on-surface-variant": "#3f4a3d",
                      "on-error": "#ffffff",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#2d3130",
                      "surface-container-lowest": "#ffffff",
                      "surface-dim": "#d8dbd8"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "stack-gap-lg": "40px",
                      "container-padding": "24px",
                      "unit": "8px",
                      "stack-gap-sm": "12px",
                      "stack-gap-md": "24px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-xl": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            padding-bottom: 90px;
            padding-top: 24px;
        }
        
        .soft-shadow {
            box-shadow: 0 4px 24px rgba(11, 61, 46, 0.05);
        }
        
        .interactive-element:active {
            transform: scale(0.98);
        }

        input, select {
            border-color: theme('colors.outline-variant') !important;
        }

        input:focus, select:focus {
            border-color: theme('colors.primary') !important;
            ring-color: theme('colors.primary') !important;
        }
    </style>
</head>
<body class="antialiased min-h-screen">
<!-- Main Content Canvas -->
<main class="max-w-[390px] mx-auto px-container-padding">
<!-- Minimalist Header -->
<div class="flex items-center gap-4 mb-stack-gap-lg h-16">
<button class="hover:bg-surface-variant/20 p-2 rounded-full transition-colors interactive-element">
<span class="material-symbols-outlined text-on-surface text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h2 class="font-headline-md text-headline-md text-on-surface">Become a Driver</h2>
</div>
<p class="font-body-md text-on-surface-variant mb-stack-gap-md px-1">Complete your application to start earning with EcoRide.</p>
<!-- Application Form -->
<form class="space-y-6 pb-8">
<!-- Driver's License -->
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1" for="license">Driver License</label>
<div class="flex items-center justify-center w-full"><label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-outline-variant rounded-xl cursor-pointer bg-surface-container-lowest hover:bg-surface-container transition-colors"><div class="flex flex-col items-center justify-center pt-5 pb-6"><span class="material-symbols-outlined text-primary text-3xl mb-2" data-icon="add_a_photo">add_a_photo</span><p class="text-body-sm text-on-surface-variant">Tap to upload license photo</p></div><input type="file" class="hidden" accept="image/*"></label></div>

</div>
<!-- Vehicle Registration -->
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1" for="registration">Vehicle License</label>
<div class="flex items-center justify-center w-full"><label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-outline-variant rounded-xl cursor-pointer bg-surface-container-lowest hover:bg-surface-container transition-colors"><div class="flex flex-col items-center justify-center pt-5 pb-6"><span class="material-symbols-outlined text-primary text-3xl mb-2" data-icon="add_a_photo">add_a_photo</span><p class="text-body-sm text-on-surface-variant">Tap to upload vehicle license</p></div><input type="file" class="hidden" accept="image/*"></label></div>
</div>
<!-- Vehicle Type -->
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1">Vehicle Type</label>
<div class="grid grid-cols-2 gap-3">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="vehicle_type" type="radio" value="electric">
<div class="p-4 bg-surface-container-lowest border-2 border-outline-variant rounded-2xl flex flex-col items-center gap-2 transition-all peer-checked:border-primary peer-checked:bg-primary-container/20">
<span class="material-symbols-outlined text-primary" data-icon="bolt">bolt</span>
<span class="font-label-md text-on-surface">Electric</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="vehicle_type" type="radio" value="hybrid">
<div class="p-4 bg-surface-container-lowest border-2 border-outline-variant rounded-2xl flex flex-col items-center gap-2 transition-all peer-checked:border-primary peer-checked:bg-primary-container/20">
<span class="material-symbols-outlined text-primary" data-icon="eco">eco</span>
<span class="font-label-md text-on-surface">Hybrid</span>
</div>
</label>
</div>
</div>
<!-- Number of Seats -->

<!-- Terms -->
<div class="flex items-start gap-3 px-1 py-2">
<input class="mt-1 rounded text-primary focus:ring-primary border-outline-variant" id="terms" type="checkbox">
<label class="font-body-sm text-on-surface-variant" for="terms">I agree to the background check and driver terms of service.</label>
</div>
<!-- Call to Action -->
<div class="pt-4">
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-8 py-4 rounded-full w-full interactive-element transition-all shadow-sm flex items-center justify-center gap-2 hover:opacity-90" type="submit">
<span class="">Submit Application</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar (Settings Active) -->
<nav class="bg-surface fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto h-20 rounded-t-lg shadow-[0_-4px_16px_rgba(0,0,0,0.04)] z-50 flex justify-around items-center px-4 pb-safe border-t border-outline-variant/10">
<button class="hover:bg-surface-container-high transition-all flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="home">home</span>
<span class="font-label-md text-[10px]">Home</span>
</button>
<button class="hover:bg-surface-container-high transition-all flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="directions_car">directions_car</span>
<span class="font-label-md text-[10px]">Rides</span>
</button>
<button class="hover:bg-surface-container-high transition-all flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="notifications">notifications</span>
<span class="font-label-md text-[10px]">Alerts</span>
</button>
<!-- Active State for Settings (Where "Become a Driver" typically lives) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 scale-95">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-md text-[10px]">Settings</span>
</button>
</nav>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('.interactive-element').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>


</body></html>
