<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EcoRide - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'eco-green': '#2D8C51',
            'eco-bg': '#A9E2B9',
            'eco-light': '#C5EFD2',
            'eco-dark': '#1F6138'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" data-snapdom="injected-import"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head>
<body class="min-h-screen">
<!-- BEGIN: MobileDeviceContainer -->
<main class="w-full min-h-screen bg-eco-bg relative overflow-hidden flex flex-col font-sans justify-center" data-purpose="mobile-container">
<!-- BEGIN: TopNavigation -->

<!-- END: TopNavigation -->
<!-- BEGIN: MainContent -->
<section class="px-8 pt-8 pb-12 flex flex-col items-center" data-purpose="main-content">
<!-- BEGIN: LogoSection -->
<div class="flex items-center justify-center mb-16 text-center flex-col space-y-3" data-purpose="logo-section">
<svg fill="none" height="40" viewBox="0 0 48 48" width="40" xmlns="http://www.w3.org/2000/svg">
<path d="M24 2C24 2 12 10 12 24C12 30.6274 17.3726 36 24 36C30.6274 36 36 30.6274 36 24C36 10 24 2 24 2Z" fill="#2D8C51"></path>
<path d="M24 46C24 46 36 38 36 24C36 17.3726 30.6274 12 24 12C17.3726 12 12 17.3726 12 24C12 38 24 46 24 46Z" fill="#1F6138"></path>
<path d="M12 24C12 24 2 32 2 46C2 46 16 46 24 36C32 26 24 24 24 24" fill="#4ADE80"></path>
</svg>
<h1 class="text-3xl font-bold text-gray-900 tracking-tight">EcoRide</h1>
</div>
<!-- END: LogoSection -->
<!-- BEGIN: LoginForm -->
<form class="space-y-4 w-full" data-purpose="login-form">
<div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-white">
<div class="border-b border-gray-100"><div class="flex items-center px-4">
<span class="material-symbols-outlined text-primary text-[20px]">phone</span>
<input class="w-full px-2 py-4 border-none focus:ring-0 text-gray-800 placeholder-gray-400 text-sm" placeholder="+962 00 000 0000" required="" type="tel">
</div></div>
<div><div class="flex items-center px-4">
<span class="material-symbols-outlined text-primary text-[20px]">lock</span>
<input class="w-full px-2 py-4 border-none focus:ring-0 text-gray-800 placeholder-gray-400 text-sm" placeholder="Password" required="" type="password">
</div></div>
</div>
<button class="w-full bg-eco-green hover:bg-eco-dark text-white font-medium py-4 rounded-xl transition-colors duration-200 mt-6 shadow-md text-base" data-purpose="login-button" type="submit">
          Login
        </button>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: FooterLinks -->
<div class="mt-8 flex flex-col items-center space-y-6" data-purpose="footer-links">
<a class="text-eco-dark hover:text-gray-900 text-sm font-medium transition-colors" href="#">Forgot password?</a>
<a class="text-gray-900 hover:text-eco-dark font-semibold text-base transition-colors" href="#">Sign up</a>
</div>
<!-- END: FooterLinks -->
</section>
<!-- END: MainContent -->
</main>
<!-- END: MobileDeviceContainer -->






</body></html>
